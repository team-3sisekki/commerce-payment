<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/default :: head('주문 내역')}" />
</head>
<body class="bg-gray-50">

<th:block th:replace="~{layout/default :: header}" />

<main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold mb-6">주문 내역</h1>

    <div id="loading" class="py-20 text-center text-gray-500">불러오는 중...</div>
    <div id="empty" class="hidden py-20 text-center">
        <p class="text-gray-500 mb-4">주문 내역이 없습니다</p>
        <a href="/" class="text-sm underline">쇼핑하러 가기</a>
    </div>
    <div id="orders" class="hidden space-y-4"></div>
</main>

<th:block th:replace="~{layout/default :: footer}" />
<th:block th:replace="~{layout/default :: scripts}" />

<script>
    const unwrap = (r) => (r && typeof r === 'object' && 'data' in r && 'code' in r) ? r.data : r;

    // OrderStatus enum 값과 정확히 일치해야 한다 (PAYMENT_PENDING / COMPLETED / CANCELED)
    const ORDER_STATUS = {
        PAYMENT_PENDING: { label: '결제 대기', color: 'bg-amber-100 text-amber-700' },
        COMPLETED:       { label: '주문 완료', color: 'bg-emerald-100 text-emerald-700' },
        CANCELED:        { label: '주문 취소', color: 'bg-gray-200 text-gray-600' }
    };

    // PaymentStatus enum 값 (철자 주의: CANCELLED는 L 두 개)
    const PAYMENT_STATUS = {
        PENDING:        '결제 대기',
        COMPLETED:      '결제 완료',
        FAILED:         '결제 실패',
        CANCELLED:      '결제 취소',
        PARTIAL_REFUND: '부분 환불',
        FULL_REFUND:    '전액 환불'
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth()) return;
        loadOrders();
    });

    async function loadOrders() {
        try {
            const orders = unwrap(await apiFetch('/api/orders')) || [];

            document.getElementById('loading').classList.add('hidden');

            if (orders.length === 0) {
                document.getElementById('empty').classList.remove('hidden');
                return;
            }

            document.getElementById('orders').innerHTML = orders.map(renderOrder).join('');
            document.getElementById('orders').classList.remove('hidden');
        } catch (e) {
            document.getElementById('loading').innerHTML =
                `<p class="text-gray-500">${e.message}</p>`;
        }
    }

    function renderOrder(order) {
        const st = ORDER_STATUS[order.status] || { label: order.status, color: 'bg-gray-100 text-gray-600' };
        const date = new Date(order.createdAt).toLocaleString('ko-KR');

        return `
        <div class="bg-white rounded-lg border border-gray-200 p-6">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <a href="/orders/${order.orderId}" class="font-mono text-sm font-medium hover:underline">
                        ${order.orderNumber || '#' + order.orderId}
                    </a>
                    <p class="text-xs text-gray-500 mt-1">${date}</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-medium ${st.color}">${st.label}</span>
            </div>

            <p class="text-sm text-gray-700 mb-3">${order.orderName}</p>

            <div class="flex items-center justify-between pt-4 border-t">
                <div class="text-sm">
                    <span class="font-semibold">${formatPrice(order.totalPrice)}원</span>
                    ${order.usedPoint > 0
                        ? `<span class="text-gray-500 ml-2">(포인트 ${formatPrice(order.usedPoint)}P 사용)</span>`
                        : ''}
                </div>
                <div class="flex gap-3">
                    <a href="/orders/${order.orderId}" class="text-xs text-gray-600 hover:text-black underline">상세</a>
                    ${renderAction(order)}
                </div>
            </div>
        </div>`;
    }

    function renderAction(order) {
        // 결제 대기 → 주문 취소 API (재고 복구)
        if (order.status === 'PAYMENT_PENDING') {
            return `<button onclick="cancelPendingOrder(${order.orderId})"
                        class="text-xs text-red-600 hover:text-red-700 underline">주문 취소</button>`;
        }
        // 결제 완료 → 환불은 상세 화면에서 (상품·수량 선택이 필요)
        if (order.status === 'COMPLETED') {
            return `<a href="/orders/${order.orderId}"
                       class="text-xs text-red-600 hover:text-red-700 underline">환불 요청</a>`;
        }
        return '';
    }

    // 결제대기 주문 취소 — 주문 취소 + 결제 실패 + 재고 복구가 한 번에 처리된다
    function cancelPendingOrder(orderId) {
        showConfirm('주문을 취소하시겠습니까?', async () => {
            try {
                await apiFetch(`/api/orders/${orderId}/cancel`, { method: 'POST' });
                showToast('주문이 취소되었습니다', 'success');
                loadOrders();
            } catch (e) {
                showToast('취소 실패: ' + e.message, 'danger');
            }
        });
    }
</script>
</body>
</html>
