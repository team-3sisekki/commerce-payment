<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{layout/default :: head('주문내역')}" />
</head>
<body class="font-sans bg-white text-sf-black min-h-screen flex flex-col">
<th:block th:replace="~{layout/default :: header}" />

<main class="flex-1">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-16">

        <h1 class="text-5xl font-light text-gray-900 mb-12 tracking-widest uppercase letter-spacing-2">주문내역</h1>

        <div id="orders-loading" class="text-center py-24">
            <div class="spinner-dark mx-auto"></div>
        </div>

        <div id="orders-empty" class="hidden text-center py-32 animate-fade-in">
            <div class="w-24 h-24 mx-auto mb-8 flex items-center justify-center">
                <i class="ri-file-list-3-line text-6xl text-gray-200"></i>
            </div>
            <h2 class="text-2xl font-light text-gray-900 mb-3 tracking-tight">주문 내역이 없습니다</h2>
            <p class="text-sm text-gray-500 mb-10">쇼핑을 시작하고 첫 주문을 만들어보세요</p>
            <a href="/" class="inline-block text-xs font-medium text-gray-900 border-b border-gray-400 hover:border-gray-900 pb-1 transition-all uppercase tracking-wider">
                쇼핑 계속하기
            </a>
        </div>

        <div id="orders-content" class="hidden space-y-5"></div>
    </div>
</main>

<th:block th:replace="~{layout/default :: footer}" />
<th:block th:replace="~{layout/default :: scripts}" />

<!-- 환불 모달 -->
<div id="refund-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-2xl w-full shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
        <div class="p-8 border-b border-gray-100 flex justify-between items-center">
            <h2 class="text-2xl font-light text-gray-900 tracking-wider uppercase">주문 취소 / 환불</h2>
            <button onclick="closeRefundModal()" class="text-gray-400 hover:text-gray-900">
                <i class="ri-close-line text-2xl"></i>
            </button>
        </div>
        <div class="p-8 overflow-y-auto">
            <p class="text-sm text-gray-600 mb-6">환불하실 상품을 선택하고 수량을 조정해주세요.</p>
            <div id="refund-items-container" class="space-y-4">
                <!-- 아이템 렌더링 영역 -->
            </div>
        </div>
        <div class="p-8 border-t border-gray-100 bg-gray-50 flex justify-end gap-4">
            <button onclick="closeRefundModal()" class="px-6 py-2.5 text-sm font-medium text-gray-600 hover:text-gray-900 uppercase tracking-wider transition-colors">취소</button>
            <button onclick="submitRefund()" class="px-6 py-2.5 text-sm font-medium bg-black text-white hover:bg-gray-800 uppercase tracking-wider transition-colors">환불 요청</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        loadOrders();
    });

    // PaymentStatus enum(PENDING, COMPLETED, FAILED, CANCELLED, PARTIAL_REFUND, FULL_REFUND)에 맞춘 라벨/색상
    let globalOrders = [];
    const statusConfig = {
        PENDING: { label: '결제 대기', color: 'text-amber-600 bg-amber-50' },
        COMPLETED: { label: '주문 확정', color: 'text-emerald-600 bg-emerald-50' },
        FAILED: { label: '결제 실패', color: 'text-red-600 bg-red-50' },
        CANCELLED: { label: '취소됨', color: 'text-gray-600 bg-gray-100' },
        PARTIAL_REFUND: { label: '부분 환불', color: 'text-blue-600 bg-blue-50' },
        FULL_REFUND: { label: '전액 환불', color: 'text-gray-600 bg-gray-100' }
    };

    async function loadOrders() {
        try {
            const orders = await apiFetch('/api/orders');
            globalOrders = orders;
            document.getElementById('orders-loading').classList.add('hidden');

            if (!orders || orders.length === 0) {
                document.getElementById('orders-empty').classList.remove('hidden');
                return;
            }

            const container = document.getElementById('orders-content');
            container.innerHTML = orders.map((order, index) => {
                const sc = statusConfig[order.paymentStatus] || statusConfig.PENDING;
                const orderDate = new Date(order.createdAt).toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const itemsHtml = (order.orderItems || []).map(item => `
                        <tr class="border-t border-gray-100 text-sm">
                            <td class="py-4 pr-4 text-gray-900">${item.productName}</td>
                            <td class="py-4 pr-4 text-right text-gray-600">${item.quantity}</td>
                            <td class="py-4 text-right text-gray-900 font-light">${formatPrice(item.orderPrice * item.quantity)}원</td>
                        </tr>
                    `).join('');

                let actionHtml = '';
                if (order.status === 'PENDING') {
                    actionHtml = `<span class="text-xs font-medium text-gray-400 uppercase tracking-wider">결제 미완료 주문</span>`;
                } else if (order.paymentStatus === 'COMPLETED' || order.paymentStatus === 'PARTIAL_REFUND') {
                    actionHtml = `<button onclick="cancelOrder(${index})" class="text-xs font-medium text-red-600 hover:text-red-700 uppercase tracking-wider">주문 취소</button>`;
                }

                return `
                    <div class="border border-gray-200 overflow-hidden animate-fade-in" style="animation-delay: ${index * 0.05}s">
                        <div class="px-8 py-6 bg-white flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-200" onclick="toggleOrder(${index})">
                            <div class="flex-1 flex items-start gap-8">
                                <div>
                                    <a href="/orders/${order.orderId}" class="text-sm font-mono font-medium text-gray-900 hover:underline" onclick="event.stopPropagation()">#${order.orderId}</a>
                                    <p class="text-xs text-gray-500 mt-2">${orderDate}</p>
                                </div>
                                <span class="${sc.color} px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">${sc.label}</span>
                            </div>
                            <div class="flex items-center gap-6">
                                <p class="text-sm font-light text-gray-900 whitespace-nowrap">${formatPrice(order.totalPrice)}원</p>
                                <i class="ri-chevron-down-line text-gray-400 transition-transform text-lg" id="arrow-${index}"></i>
                            </div>
                        </div>
                        <div id="order-detail-${index}" class="hidden">
                            <div class="px-8 py-8 bg-gray-50">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-gray-200">
                                            <th class="text-left py-3 pr-4 font-medium text-gray-900 text-xs uppercase tracking-wider">상품</th>
                                            <th class="text-right py-3 pr-4 font-medium text-gray-900 text-xs uppercase tracking-wider">수량</th>
                                            <th class="text-right py-3 font-medium text-gray-900 text-xs uppercase tracking-wider">금액</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${itemsHtml}
                                    </tbody>
                                </table>
                            </div>
                            <div class="px-8 py-6 bg-white border-t border-gray-200 flex items-center justify-between">
                                <div class="flex items-center gap-6">
                                    <a href="/orders/${order.orderId}" class="text-xs font-medium text-gray-900 border-b border-gray-300 hover:border-gray-900 uppercase tracking-wider">상세보기</a>
                                    ${actionHtml}
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">주문 합계</p>
                                    <p class="text-lg font-light text-gray-900">${formatPrice(order.totalPrice)}원</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            container.classList.remove('hidden');

        } catch (e) {
            document.getElementById('orders-loading').classList.add('hidden');
            showToast('주문내역을 불러올 수 없습니다', 'danger');
        }
    }

    function toggleOrder(index) {
        const detail = document.getElementById('order-detail-' + index);
        const arrow = document.getElementById('arrow-' + index);
        detail.classList.toggle('hidden');
        arrow.style.transform = detail.classList.contains('hidden') ? '' : 'rotate(180deg)';
    }

    let currentRefundPaymentId = null;

    async function cancelOrder(index) {
        const order = globalOrders[index];
        if (!order) return;
        
        try {
            // 환불 가능 상품 목록 조회 API 호출 (방금 백엔드에 만든 API)
            const items = await apiFetch(`/api/refunds/refundable/${order.paymentId}`);
            currentRefundPaymentId = order.paymentId;
            openRefundModal(items);
        } catch (e) {
            showToast('환불 정보를 불러오는데 실패했습니다: ' + e.message, 'danger');
        }
    }

    function openRefundModal(items) {
        const container = document.getElementById('refund-items-container');
        
        container.innerHTML = items.map((item, idx) => {
            // remainQuantity가 0이면 이미 전액 환불된 상품이므로 비활성화 처리
            const isRefunded = item.remainQuantity === 0;
            const disabledAttr = isRefunded ? 'disabled' : '';
            const opacityClass = isRefunded ? 'opacity-50 bg-gray-50' : 'bg-white';
            const badgeHtml = isRefunded ? '<span class="ml-2 text-xs font-medium text-red-500 bg-red-50 px-2 py-0.5 rounded border border-red-100">환불 완료</span>' : '';
            
            return `
                <div class="flex items-center gap-4 p-4 border border-gray-200 transition-colors ${opacityClass}">
                    <input type="checkbox" id="refund-chk-${item.orderItemId}" value="${item.orderItemId}" class="w-4 h-4 text-black border-gray-300 rounded focus:ring-black" ${disabledAttr}>
                    <div class="flex-1 min-w-0">
                        <label for="refund-chk-${item.orderItemId}" class="block text-sm font-medium text-gray-900 truncate cursor-pointer ${isRefunded ? 'cursor-not-allowed' : ''}">
                            ${item.productName} ${badgeHtml}
                        </label>
                        <p class="text-xs text-gray-500 mt-1 font-mono">
                            단가: ${formatPrice(item.orderPrice)}원 
                            <span class="mx-1">|</span> 주문: ${item.originalQuantity}개 
                            ${item.originalQuantity - item.remainQuantity > 0 ? `<span class="mx-1">|</span> <span class="text-red-500">환불됨: ${item.originalQuantity - item.remainQuantity}개</span>` : ''}
                            <span class="mx-1">|</span> 환불 가능 수량: ${item.remainQuantity}개
                        </p>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-xs text-gray-500 uppercase tracking-wider">환불수량</label>
                        <input type="number" id="refund-qty-${item.orderItemId}" 
                            min="1" max="${item.remainQuantity}" value="${isRefunded ? 0 : item.remainQuantity}" 
                            class="w-16 px-2 py-1 text-sm border border-gray-300 text-center focus:outline-none focus:border-black focus:ring-0 ${isRefunded ? 'bg-gray-100' : ''}" 
                            ${disabledAttr}
                            oninput="if(this.value > ${item.remainQuantity}) this.value = ${item.remainQuantity}; if(this.value < 1 && !${isRefunded}) this.value = 1;"
                        >
                    </div>
                </div>
            `;
        }).join('');
        
        document.getElementById('refund-modal').classList.remove('hidden');
    }

    function closeRefundModal() {
        document.getElementById('refund-modal').classList.add('hidden');
        currentRefundPaymentId = null;
    }

    async function submitRefund() {
        const container = document.getElementById('refund-items-container');
        const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
        
        if (checkboxes.length === 0) {
            showToast('환불할 상품을 하나 이상 선택해주세요.', 'warning');
            return;
        }

        const items = Array.from(checkboxes).map(chk => {
            const orderItemId = parseInt(chk.value);
            const qtyInput = document.getElementById(`refund-qty-${orderItemId}`);
            return {
                orderItemId: orderItemId,
                requestQuantity: parseInt(qtyInput.value)
            };
        });

        showConfirm('선택하신 상품을 환불하시겠습니까?', async () => {
            try {
                await apiFetch('/api/refunds', {
                    method: 'POST',
                    body: JSON.stringify({
                        paymentId: currentRefundPaymentId,
                        cancelReason: '사용자 요청 (부분/전액 환불)',
                        items: items
                    })
                });
                
                showToast('환불 요청이 성공적으로 처리되었습니다.', 'success');
                closeRefundModal();
                loadOrders(); // 목록 새로고침
            } catch (e) {
                showToast('환불 처리 실패: ' + e.message, 'danger');
            }
        });
    }
</script>
</body>
</html>
