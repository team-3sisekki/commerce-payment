<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/default :: head('주문 완료')}" />
</head>
<body class="bg-gray-50">

<th:block th:replace="~{layout/default :: header}" />

<main class="max-w-xl mx-auto px-4 py-16">

    <div id="loading" class="py-20 text-center text-gray-500">확인 중...</div>

    <div id="content" class="hidden text-center">
        <div class="text-5xl mb-4">✓</div>
        <h1 class="text-2xl font-bold mb-2">주문이 완료되었습니다</h1>
        <p class="text-sm text-gray-500 mb-8">주문해 주셔서 감사합니다.</p>

        <section class="bg-white rounded-lg border border-gray-200 p-6 space-y-3 text-sm text-left">
            <div class="flex justify-between"><span class="text-gray-600">주문번호</span><span id="order-number" class="font-mono"></span></div>
            <div class="flex justify-between"><span class="text-gray-600">주문상품</span><span id="order-name"></span></div>
            <div class="flex justify-between"><span class="text-gray-600">주문 총액</span><span id="total-price"></span></div>
            <div class="flex justify-between"><span class="text-gray-600">포인트 사용</span><span id="used-point"></span></div>
            <div class="flex justify-between"><span class="text-gray-600">카드 결제</span><span id="pg-amount"></span></div>
            <div class="flex justify-between pt-3 border-t">
                <span class="text-gray-600">적립 포인트</span>
                <span id="accrued-point" class="text-emerald-600 font-medium"></span>
            </div>
        </section>

        <div class="flex gap-3 mt-8">
            <a href="/" class="flex-1 py-3 text-center border border-gray-300 rounded-lg hover:bg-gray-50">쇼핑 계속하기</a>
            <a id="detail-link" href="/orders" class="flex-1 py-3 text-center bg-black text-white rounded-lg hover:bg-gray-800">주문 상세</a>
        </div>
    </div>
</main>

<th:block th:replace="~{layout/default :: footer}" />
<th:block th:replace="~{layout/default :: scripts}" />

<script>
    const unwrap = (r) => (r && typeof r === 'object' && 'data' in r && 'code' in r) ? r.data : r;

    document.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth()) return;
        loadComplete();
    });

    async function loadComplete() {
        const orderId = new URLSearchParams(location.search).get('orderId');

        if (!orderId) {
            document.getElementById('loading').innerHTML =
                `<p class="text-gray-500 mb-4">주문 정보가 없습니다</p>
                 <a href="/orders" class="text-sm underline">주문 내역으로</a>`;
            return;
        }

        try {
            const order = unwrap(await apiFetch(`/api/orders/${orderId}`));

            document.getElementById('order-number').textContent  = order.orderNumber || ('#' + order.orderId);
            document.getElementById('order-name').textContent     = order.orderName;
            document.getElementById('total-price').textContent    = formatPrice(order.totalPrice) + '원';
            document.getElementById('used-point').textContent     = formatPrice(order.usedPoint) + 'P';
            document.getElementById('pg-amount').textContent      = formatPrice(order.pgAmount) + '원';
            document.getElementById('accrued-point').textContent  = '+' + formatPrice(order.accruedPoint) + 'P';
            document.getElementById('detail-link').href           = '/orders/' + order.orderId;

            // 결제 완료 시점에 장바구니가 비워지므로 헤더 뱃지를 갱신한다
            updateCartBadge();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        } catch (e) {
            document.getElementById('loading').innerHTML =
                `<p class="text-gray-500 mb-4">${e.message}</p>
                 <a href="/orders" class="text-sm underline">주문 내역으로</a>`;
        }
    }
</script>
</body>
</html>
