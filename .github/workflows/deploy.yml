name: Deploy to Public EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (Exclude Tests for faster deploy, remove -x test if needed)
        run: ./gradlew bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set SHORT_SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          DOCKER_REPO=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO_NAME }}
          docker build --platform linux/amd64 -t $DOCKER_REPO:${{ env.SHORT_SHA }} -t $DOCKER_REPO:latest .
          docker push $DOCKER_REPO:${{ env.SHORT_SHA }}
          docker push $DOCKER_REPO:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO_NAME: ${{ secrets.DOCKER_REPO_NAME }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
          # application-prod.yml 환경변수들
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_CHANNEL_KEY: ${{ secrets.PORTONE_CHANNEL_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME, DOCKER_REPO_NAME, SHORT_SHA, DB_URL, DB_USERNAME, DB_PASSWORD, PORTONE_API_SECRET, PORTONE_STORE_ID, PORTONE_CHANNEL_KEY
          script: |
            # 1. 시스템 업데이트 및 도커 설치 (Amazon Linux 2023 기준)
            sudo dnf update -y
            sudo dnf install -y docker
            sudo systemctl enable docker
            sudo systemctl start docker
            
            # 2. 최신 이미지 Pull (Public Repo 가정)
            DOCKER_IMAGE="$DOCKER_USERNAME/$DOCKER_REPO_NAME:$SHORT_SHA"
            sudo docker pull $DOCKER_IMAGE
            
            # 3. 기존 컨테이너 중지 및 삭제
            sudo docker stop spring-app || true
            sudo docker rm spring-app || true
            
            # 4. 새 컨테이너 실행 (환경변수 주입)
            sudo docker run -d --name spring-app -p 8080:8080 --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL=$DB_URL \
              -e DB_USERNAME=$DB_USERNAME \
              -e DB_PASSWORD=$DB_PASSWORD \
              -e PORTONE_API_SECRET=$PORTONE_API_SECRET \
              -e PORTONE_STORE_ID=$PORTONE_STORE_ID \
              -e PORTONE_CHANNEL_KEY=$PORTONE_CHANNEL_KEY \
              $DOCKER_IMAGE
            
            # 5. 사용하지 않는 도커 이미지 청소
            sudo docker image prune -a -f
